name: CarLocator
options:
  bundleIdPrefix: com.jasongrech
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  CarLocator:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Shared
      - CarLocator
    info:
      path: CarLocator/Info.plist
      properties:
        CFBundleDisplayName: Car Locator
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: "Car Locator needs your location to save where you parked and to show the compass to your car."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Car Locator saves your parking spot automatically when your phone disconnects from your car's Bluetooth. This needs Always access so it can work without opening the app."
        LSApplicationQueriesSchemes:
          - waze
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - carlocator
    entitlements:
      path: CarLocator/CarLocator.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jasongrech.carlocator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasongrech.carlocator
    dependencies:
      - target: CarLocatorWidgetExtension
        embed: true

  CarLocatorWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Shared
      - CarLocatorWidget
    info:
      path: CarLocatorWidget/Info.plist
      properties:
        CFBundleDisplayName: Car Locator Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CarLocatorWidget/CarLocatorWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jasongrech.carlocator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasongrech.carlocator.widget
        SKIP_INSTALL: YES
